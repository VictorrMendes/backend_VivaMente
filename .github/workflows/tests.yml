name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vivamente
          POSTGRES_PASSWORD: vivamente
          POSTGRES_DB: vivamente
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://vivamente:vivamente@localhost:5432/vivamente
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "True"
      ALLOWED_ORIGINS: http://localhost:3000
      # Placeholder - os testes de apps.accounts.tests.test_internal_identity
      # sobrescrevem esta chave via @override_settings com um par RS256 de
      # teste; isto so precisa existir pra config/settings/base.py carregar.
      INTERNAL_SERVICE_JWT_PUBLIC_KEY: "-----BEGIN PUBLIC KEY-----\\nplaceholder\\n-----END PUBLIC KEY-----"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Django check
        run: python manage.py check

      - name: Rodar testes
        run: python manage.py test apps tests
